name: Auto-post to Facebook & Instagram

on:
  schedule:
    # TEMP placeholder — Mon/Wed/Fri 08:00 Asia/Manila (00:00 UTC).
    # Will be finalized once the posting schedule is confirmed.
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

permissions:
  contents: write # needed so the workflow can commit the generated image back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install Pillow requests

      - name: Configure git identity
        run: |
          git config user.name "auto-poster-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Generate + publish next queued post
        # This script pushes the generated image to the repo itself partway
        # through (Instagram's API needs it to be publicly fetchable before
        # the post_to_meta.py step runs), then updates content/state.json.
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python poster/scripts/run.py

      - name: Commit updated queue state
        run: |
          git add poster/content/state.json
          git diff --cached --quiet || git commit -m "Update posting state: $(date -u +%Y-%m-%d)"
          git push
